[project]
name = "hyperliquid-tradingview-bridge"
version = "2.2.0"
description = "TradingView to Hyperliquid Perpetual Exchange Declarative Webhook Bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "hyperliquid-python-sdk>=0.8.0",
    "eth-account>=0.11.0",
]

[tool.vercel]
entrypoint = "main:app"
